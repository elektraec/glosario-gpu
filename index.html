
<div id="gpu-flashcards" style="font-family: Arial, sans-serif; max-width: 650px; margin: auto; text-align: center;">

  <h2 style="color:#1f4e79;">Glosario</h2>
  <p>Haz clic en la tarjeta para ver la definición. Usa las flechas para avanzar o retroceder.</p>

  <div id="card"
       onclick="flipCard()"
       style="min-height: 230px; border-radius: 16px; border: 1px solid #cfd8dc; box-shadow: 0 4px 10px rgba(0,0,0,0.15); padding: 30px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#eaf3fb; color:#1f4e79; font-size:1.8em; font-weight:bold;">
  </div>

  <p id="counter" style="margin-top:12px; color:#555;"></p>

  <div style="margin-top: 15px;">
    <button onclick="prevCard()" style="padding:10px 18px; margin:5px; border:none; border-radius:8px; background:#1f4e79; color:white; cursor:pointer;">← Anterior</button>
    <button onclick="flipCard()" style="padding:10px 18px; margin:5px; border:none; border-radius:8px; background:#607d8b; color:white; cursor:pointer;">Voltear</button>
    <button onclick="nextCard()" style="padding:10px 18px; margin:5px; border:none; border-radius:8px; background:#1f4e79; color:white; cursor:pointer;">Siguiente →</button>
  </div>

  <script>
    const cards = [
      ```javascript
["Ancho de Banda", "Cantidad máxima de datos que pueden transferirse entre la GPU y la memoria en un segundo. Se mide en GB/s o TB/s y determina qué tan rápido los núcleos de la GPU pueden recibir y procesar información."],

["Arquitectura GPU", "Diseño interno y organización funcional de una GPU. Incluye núcleos de procesamiento, memoria, cachés, controladores y unidades especializadas que permiten ejecutar miles de operaciones en paralelo."],

["Bloque", "Grupo de hilos (threads) que se ejecutan dentro de un Streaming Multiprocessor (SM). Los hilos de un mismo bloque pueden compartir memoria y sincronizarse durante la ejecución."],

["Bus de Memoria", "Conjunto de líneas de comunicación que conectan la GPU con la VRAM. Su ancho, medido en bits, influye directamente en el ancho de banda disponible para mover datos."],

["CUDA", "Plataforma de programación paralela desarrollada por NVIDIA que permite utilizar la GPU para tareas de propósito general como inteligencia artificial, simulación científica y procesamiento masivo de datos."],

["CUDA Core", "Unidad básica de procesamiento en una GPU NVIDIA. Ejecuta operaciones aritméticas y lógicas sobre datos, funcionando como el equivalente a una ALU en arquitecturas paralelas."],

["Cache", "Memoria de alta velocidad ubicada dentro del procesador que almacena datos utilizados frecuentemente. Reduce el acceso a la memoria principal y mejora el rendimiento general del sistema."],

["Clúster GPU", "Conjunto de varias GPUs trabajando de forma coordinada para resolver problemas de gran escala. Se utiliza en supercomputación, centros de datos e inteligencia artificial."],

["Deep Learning", "Subcampo de la inteligencia artificial basado en redes neuronales profundas. Requiere una enorme cantidad de operaciones matriciales, por lo que depende fuertemente de las GPU modernas."],

["DLSS", "Tecnología de NVIDIA que utiliza redes neuronales para generar imágenes de alta resolución a partir de resoluciones más bajas, mejorando el rendimiento sin sacrificar calidad visual."],

["FP32", "Formato de punto flotante de 32 bits utilizado para representar números reales. Es el estándar tradicional para gráficos 3D y muchas aplicaciones científicas."],

["Frecuencia de Reloj", "Cantidad de ciclos que un procesador ejecuta por segundo. Se expresa en MHz o GHz y representa la velocidad básica de operación del hardware."],

["GDDR", "Familia de memorias diseñadas específicamente para tarjetas gráficas. Están optimizadas para proporcionar un ancho de banda mucho mayor que la memoria RAM convencional."],

["GDDR6X", "Tipo de memoria gráfica de alto rendimiento utilizada en GPUs modernas. Emplea técnicas avanzadas de señalización para aumentar la velocidad de transferencia de datos."],

["GDDR7", "Nueva generación de memoria gráfica que mejora el ancho de banda, la eficiencia energética y la integridad de señal respecto a generaciones anteriores."],

["GPU", "Unidad de Procesamiento Gráfico diseñada para ejecutar miles de operaciones simultáneamente. Su arquitectura está optimizada para el paralelismo masivo y el procesamiento de grandes volúmenes de datos."],

["GPGPU", "Uso de una GPU para realizar tareas distintas al procesamiento gráfico, como inteligencia artificial, simulación física, minería de datos o computación científica."],

["Grid", "Conjunto total de bloques que participan en la ejecución de un kernel. Representa toda la carga de trabajo distribuida sobre la GPU."],

["HBM", "High Bandwidth Memory. Memoria apilada verticalmente en 3D que ofrece un ancho de banda extremadamente alto y menor consumo energético que las memorias gráficas tradicionales."],

["HBM3e", "Versión avanzada de HBM utilizada en aceleradores de IA y centros de datos. Puede superar varios terabytes por segundo de ancho de banda."],

["Hilo / Thread", "Unidad mínima de ejecución en una GPU. Cada hilo procesa una pequeña parte de un problema y puede ejecutarse simultáneamente con miles de otros hilos."],

["IA", "Campo de la informática dedicado al desarrollo de sistemas capaces de aprender, razonar o tomar decisiones. Actualmente es uno de los principales impulsores de la evolución de las GPU."],

["Inferencia", "Proceso mediante el cual un modelo de inteligencia artificial ya entrenado genera predicciones, respuestas o clasificaciones a partir de nuevos datos."],

["Kernel", "Función que se ejecuta en paralelo sobre miles de hilos dentro de la GPU. Constituye la unidad básica de trabajo en programación CUDA y OpenCL."],

["Latencia", "Tiempo que tarda una operación en completarse o un dato en estar disponible. Un sistema puede tener alto ancho de banda pero también alta latencia."],

["LLM", "Large Language Model. Modelo de lenguaje de gran tamaño entrenado con enormes volúmenes de datos para comprender y generar lenguaje natural."],

["Memoria Compartida", "Memoria rápida localizada dentro de cada Streaming Multiprocessor. Puede ser utilizada por todos los hilos de un mismo bloque para acelerar el intercambio de datos."],

["Multiplicación de Matrices", "Operación matemática fundamental en gráficos, simulaciones e inteligencia artificial. Es la principal razón por la que las GPU son tan eficaces en Deep Learning."],

["Núcleo", "Unidad de procesamiento capaz de ejecutar instrucciones. En una GPU existen miles de núcleos simples trabajando en paralelo."],

["NVLink", "Tecnología de interconexión de alta velocidad desarrollada por NVIDIA para permitir el intercambio eficiente de datos entre múltiples GPUs."],

["OpenCL", "Estándar abierto para programación paralela que permite ejecutar aplicaciones en GPUs, CPUs y aceleradores de distintos fabricantes."],

["Paralelismo Masivo", "Capacidad de ejecutar simultáneamente miles o millones de operaciones independientes. Es la característica principal que distingue a una GPU de una CPU."],

["PCIe", "Interfaz de comunicación de alta velocidad utilizada para conectar la GPU con la CPU y otros componentes del sistema."],

["Pipeline Gráfico", "Conjunto de etapas que transforman modelos tridimensionales en imágenes finales visibles en pantalla mediante procesamiento paralelo."],

["Ray Tracing", "Técnica de renderizado que simula el comportamiento físico de la luz para producir reflejos, sombras e iluminación altamente realistas."],

["RT Core", "Unidad especializada presente en GPUs modernas para acelerar los cálculos asociados al trazado de rayos en tiempo real."],

["Registros", "Memoria más rápida disponible dentro del procesador. Cada hilo dispone de registros propios para almacenar datos temporales durante la ejecución."],

["Shader", "Programa especializado que se ejecuta en la GPU para calcular posiciones, colores, texturas, iluminación y otros efectos gráficos."],

["SIMD", "Modelo de ejecución donde una única instrucción se aplica simultáneamente a múltiples elementos de datos. Es la base del procesamiento vectorial."],

["SIMT", "Modelo utilizado por las GPU modernas donde múltiples hilos ejecutan instrucciones similares manteniendo cierta independencia de ejecución."],

["SM", "Streaming Multiprocessor. Unidad principal de ejecución en las GPUs NVIDIA que contiene núcleos CUDA, registros, memoria compartida y lógica de control."],

["Stream Processor", "Unidad básica de procesamiento utilizada en GPUs AMD. Desempeña un papel equivalente al de los CUDA Cores en NVIDIA."],

["Tensor Core", "Unidad especializada en operaciones matriciales y de precisión mixta. Acelera significativamente el entrenamiento y la inferencia de modelos de inteligencia artificial."],

["TFLOPS", "Medida del rendimiento computacional que indica cuántos billones de operaciones de punto flotante puede realizar un procesador cada segundo."],

["Throughput", "Cantidad total de trabajo completado por un sistema en una unidad de tiempo. Las GPU priorizan throughput elevado frente a baja latencia."],

["Vertex Shader", "Etapa del pipeline gráfico responsable de transformar y procesar los vértices de modelos tridimensionales antes de la rasterización."],

["VRAM", "Memoria dedicada de una GPU utilizada para almacenar texturas, modelos, buffers de imágenes y datos necesarios para gráficos e inteligencia artificial."],

["Warp", "Grupo de 32 hilos que se ejecutan de forma coordinada en una GPU NVIDIA. Es la unidad básica de planificación del hardware."],

["Wavefront", "Grupo de hilos equivalente al Warp en las arquitecturas AMD. Constituye la unidad básica de ejecución paralela en estas GPUs."]

    ];

    let index = 0;
    let showingDefinition = false;

    function renderCard() {
      const card = document.getElementById("card");
      const counter = document.getElementById("counter");

      card.innerHTML = showingDefinition ? cards[index][1] : cards[index][0];

      if (showingDefinition) {
        card.style.background = "#ffffff";
        card.style.color = "#222";
        card.style.fontSize = "1.05em";
        card.style.fontWeight = "normal";
        card.style.lineHeight = "1.6";
      } else {
        card.style.background = "#eaf3fb";
        card.style.color = "#1f4e79";
        card.style.fontSize = "1.8em";
        card.style.fontWeight = "bold";
      }

      counter.innerHTML = "Tarjeta " + (index + 1) + " de " + cards.length;
    }

    function flipCard() {
      showingDefinition = !showingDefinition;
      renderCard();
    }

    function nextCard() {
      index = (index + 1) % cards.length;
      showingDefinition = false;
      renderCard();
    }

    function prevCard() {
      index = (index - 1 + cards.length) % cards.length;
      showingDefinition = false;
      renderCard();
    }

    renderCard();
  </script>

</div>
```
